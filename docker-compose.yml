services:
  # =========================
  # Database (PRIVATE)
  # =========================
  db:
    image: postgres:15-alpine
    container_name: portfolio_db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
    networks:
      - portfolio-internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # API (Backend)
  # =========================
  api:
    build:
      context: ./backend
    container_name: portfolio_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - .:/project_root
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: sh /app/entrypoint.sh sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - default
      - traefik-proxy
      - portfolio-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio-api.rule=Host(`${HOST:-eric.linkerx.dev}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.portfolio-api.entrypoints=websecure"
      - "traefik.http.routers.portfolio-api.tls=true"
      - "traefik.http.routers.portfolio-api.priority=100"
      - "traefik.docker.network=asseqr-system_app-network"
      - "traefik.http.services.portfolio-api.loadbalancer.server.port=8000"

  # =========================
  # Frontend (Nginx Production Build)
  # =========================
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: portfolio_frontend
    restart: always
    # ports:
    #   - "80:80" # Disabled to avoid conflict with host's Traefik/Nginx. Traefik handles this via networks.
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio-frontend.rule=Host(`${HOST:-eric.linkerx.dev}`)"
      - "traefik.http.routers.portfolio-frontend.entrypoints=websecure"
      - "traefik.http.routers.portfolio-frontend.tls=true"
      - "traefik.http.routers.portfolio-frontend.priority=10"
      - "traefik.docker.network=asseqr-system_app-network"
      - "traefik.http.services.portfolio-frontend.loadbalancer.server.port=80"

# =========================
# Networks
# =========================
networks:
  # Shared Traefik network (from asseqr-system)
  traefik-proxy:
    external: true
    name: asseqr-system_app-network

  # Private internal network
  portfolio-internal:
    driver: bridge

# =========================
# Volumes
# =========================
volumes:
  portfolio_pgdata:
