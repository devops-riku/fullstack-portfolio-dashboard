services:
  db:
    image: postgres:15-alpine
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - traefik-proxy

  backend:
    build:
      context: ./backend
    # ports:
    #   - "8000:8000"
    volumes:
      - ./backend:/app
      - .:/project_root
    env_file:
      - path: .env.example
      - path: .env
        required: false

    depends_on:
      db:
        condition: service_healthy
    command: sh /app/entrypoint.sh sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - traefik-proxy
      - portfolio-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(\"${HOST:-eric.linkerx.dev}\") && PathPrefix(\"/api\")"
      - "traefik.http.routers.backend.entrypoints=web,websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
    # ports:
    #   - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      - backend
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(\"${HOST:-eric.linkerx.dev}\") && PathPrefix(\"/\")"
      - "traefik.http.routers.frontend.entrypoints=web,websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

volumes:
  portfolio_postgres_data:


networks:
  # Shared Traefik network (from App 1)
  traefik-proxy:
    external: true
    name: asseqr-system_app-network

  # Local network for this app
  portfolio-internal:
    driver: bridge