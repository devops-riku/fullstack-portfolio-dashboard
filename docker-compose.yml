services:
  db:
    image: postgres:15-alpine
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    # ports:
    #   - "8000:8000"
    volumes:
      - ./backend:/app
      - .:/project_root
    env_file:
      - path: .env.example
      - path: .env
        required: false

    depends_on:
      db:
        condition: service_healthy
    command: sh /app/entrypoint.sh sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - default
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${HOST:-localhost}`) && PathPrefix(`/api`)"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
    # ports:
    #   - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      - backend
    networks:
      - default
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${HOST:-localhost}`) && PathPrefix(`/`)"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"

volumes:
  postgres_data:


networks:
  traefik_network:
    external: true
